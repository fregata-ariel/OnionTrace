name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / Python ${{ matrix.python }} / Clang 18
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev libclang-18-dev llvm-18-dev cmake ninja-build
      - name: Build and execute fixture through CMake
        run: |
          cmake -S fixture -B build -G Ninja -DCMAKE_C_COMPILER=clang-18 -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
          ctest --test-dir build --output-on-failure
          test -s build/compile_commands.json
      - name: Rebuild CFG, run all stages, and test without skips
        run: python scripts/ci.py --cc clang-18 --out out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: core-python-${{ matrix.python }}
          path: |
            out/
            build/Testing/Temporary/LastTest.log
            build/compile_commands.json
          if-no-files-found: error
          retention-days: 14

  sanitizers:
    name: C fixture / ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev cmake ninja-build
      - name: Build and exercise instrumented fixture
        run: |
          cmake -S fixture -B build-sanitizers -G Ninja -DCMAKE_C_COMPILER=clang-18 -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          cmake --build build-sanitizers
          ctest --test-dir build-sanitizers --output-on-failure
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: fixture-sanitizers
          path: build-sanitizers/Testing/Temporary/LastTest.log
          if-no-files-found: error
          retention-days: 14

  viewer:
    name: Viewer / Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install fixture compiler and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libclang-18-dev llvm-18-dev cmake ninja-build fonts-noto-cjk
      - name: Install locked development dependencies
        run: npm ci
      - name: Rebuild fixture and generate viewer inputs
        run: python scripts/ci.py --cc clang-18 --out out
      - name: Check DOM behavior and SVG generation
        run: npm run test:dom
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Test actual browser behavior and layout
        run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: viewer-evidence
          path: |
            out/
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14

